<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>消防安全敬業度與應變成熟度量表</title>
<style>
  :root {
    --primary: #dc2626;
    --primary-dark: #b91c1c;
    --border: #d1d5db;
    --bg: #f3f4f6;
    --text: #111827;
    --muted: #6b7280;
    --success: #16a34a;
    --error: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px;
  }
  .wrap {
    max-width: 680px;
    margin: 0 auto;
  }
  .card {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    padding: 32px 28px;
    margin-bottom: 16px;
  }

  /* ---- 進度條 ---- */
  .progress-track {
    height: 6px;
    background: #e5e7eb;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .progress-fill {
    height: 100%;
    background: var(--primary);
    border-radius: 999px;
    transition: width .25s ease;
  }
  .step-label {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 20px;
  }

  /* ---- 說明頁 ---- */
  h1 {
    font-size: 22px;
    margin: 0 0 6px;
    text-align: center;
  }
  h2.subtitle {
    font-size: 15px;
    font-weight: 400;
    color: var(--muted);
    text-align: center;
    margin: 0 0 24px;
  }
  .intro-section h3 {
    font-size: 15px;
    margin: 0 0 8px;
    color: var(--primary-dark);
  }
  .intro-section p {
    font-size: 14px;
    line-height: 1.8;
    color: #374151;
    margin: 0 0 20px;
  }
  .scale-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 24px;
  }
  .scale-legend span {
    background: #fef2f2;
    color: var(--primary-dark);
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid #fecaca;
  }

  label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .required::after {
    content: " *";
    color: var(--error);
  }
  input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    font-size: 15px;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 20px;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--primary); }

  /* ---- 基本資料 ---- */
  .field-group {
    margin-bottom: 20px;
  }
  .field-group.unanswered label {
    color: var(--error);
  }
  .yesno-options {
    display: flex;
    gap: 10px;
  }
  .yesno-btn {
    padding: 10px 28px;
    border-radius: 8px;
    border: 2px solid var(--border);
    cursor: pointer;
    user-select: none;
    font-size: 14px;
    font-weight: 600;
    background: #fff;
    transition: all .15s;
  }
  .yesno-btn:hover { border-color: var(--primary); }
  .yesno-btn.selected {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }

  /* ---- 題目層 ---- */
  .layer-title {
    font-size: 17px;
    font-weight: 700;
    margin: 0 0 20px;
    color: var(--primary-dark);
    border-left: 4px solid var(--primary);
    padding-left: 10px;
  }
  .question {
    margin-bottom: 26px;
    padding-bottom: 22px;
    border-bottom: 1px solid #f0f0f0;
  }
  .question:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .question-code {
    font-size: 12px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 4px;
  }
  .question-text {
    font-size: 14.5px;
    line-height: 1.6;
    margin-bottom: 14px;
  }
  .options {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .option-circle {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    cursor: pointer;
    user-select: none;
    transition: all .15s;
    background: #fff;
  }
  .option-circle:hover { border-color: var(--primary); }
  .option-circle.selected {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
    transform: scale(1.08);
  }
  .option-hint {
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
  }
  .question.unanswered .question-text { color: var(--error); }

  /* ---- 確認頁 ---- */
  .review-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
    margin-bottom: 10px;
  }
  .review-table th, .review-table td {
    text-align: left;
    padding: 8px 6px;
    border-bottom: 1px solid #f0f0f0;
  }
  .review-table th { color: var(--muted); font-weight: 600; width: 70%; }
  .review-score {
    font-weight: 700;
    color: var(--primary-dark);
    text-align: center;
  }

  /* ---- 按鈕列 ---- */
  .btn-row {
    display: flex;
    gap: 12px;
    margin-top: 24px;
  }
  button {
    flex: 1;
    padding: 13px;
    font-size: 15px;
    font-weight: 600;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    transition: background .15s, opacity .15s;
  }
  .btn-primary {
    background: var(--primary);
    color: #fff;
  }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-primary:disabled { background: #9ca3af; cursor: not-allowed; }
  .btn-secondary {
    background: #f3f4f6;
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { background: #e5e7eb; }

  #message {
    margin-top: 14px;
    font-size: 14px;
    text-align: center;
    display: none;
  }
  #message.error { color: var(--error); display: block; }
  #message.success { color: var(--success); display: block; font-weight: 600; }
</style>
</head>
<body>

<div class="wrap">
  <div class="card">
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="step-label" id="stepLabel"></div>
    <div id="content"></div>
    <div id="message"></div>
  </div>
</div>

<script>
  // ============ 設定 ============
  // 請將此處換成實際部署在 Render 上的 API 網址
  const API_BASE_URL = 'https://web-service-api-ru6y.onrender.com';

  // customer的10碼ID：從網址參數 ?id=XXXXXXXXXX 取得
  const urlParams = new URLSearchParams(window.location.search);
  const customerId = urlParams.get('id') || '';

  const LEGEND = ['非常不同意', '不同意', '普通/無意見', '同意', '非常同意'];

  const PROFILE_FIELDS = [
    { key: 'years_of_service', label: '年資', type: 'text', placeholder: '例如：3年' },
    { key: 'position', label: '職務', type: 'text', placeholder: '請輸入您的職務' },
    { key: 'is_fire_brigade_member', label: '是否為自衛消防編組成員', type: 'yesno' },
    { key: 'has_fire_training', label: '是否接受過消防訓練', type: 'yesno' },
    { key: 'last_training_time', label: '最近一次訓練時間', type: 'text', placeholder: '例如：2026年3月，若尚未受訓請填「尚未」' },
    { key: 'used_extinguisher', label: '是否實際操作過滅火器', type: 'yesno' },
    { key: 'joined_tabletop_drill', label: '是否參與過桌面演練', type: 'yesno' },
    { key: 'joined_live_drill', label: '是否參加過實兵演練', type: 'yesno' },
    { key: 'experienced_real_fire', label: '是否曾遇過真實火警', type: 'yesno' },
  ];

  const LAYERS = [
    {
      title: '一、基本需求',
      questions: [
        { code: 'Q1', text: '我知道推動安全上對我的工作要求。' },
        { code: 'Q2', text: '我有了解我的安全工作所需要的材料和設備。' },
      ],
    },
    {
      title: '二、個人',
      questions: [
        { code: 'Q3', text: '在安全工作中，我每天都有機會做我最擅長做的事。' },
        { code: 'Q4', text: '在過去的七天裡，我因安全工作出色而受到表揚。' },
        { code: 'Q5', text: '我覺得我的主管或同事關心我的個人推動安全情況。' },
        { code: 'Q6', text: '工作單位有人鼓勵我在安全上的發展。' },
      ],
    },
    {
      title: '三、團隊',
      questions: [
        { code: 'Q7', text: '在工作中，我覺得我的安全意見受到重視。' },
        { code: 'Q8', text: '組織對安全的使命／目標使我覺得我的工作重要。' },
        { code: 'Q9', text: '我的同事們致力於高品質的安全工作。' },
        { code: 'Q10', text: '我在組織有一個志同道合的朋友。' },
      ],
    },
    {
      title: '四、成長',
      questions: [
        { code: 'Q11', text: '在過去的六個月內，組織有人和我談及我的進步。' },
        { code: 'Q12', text: '過去一年裡，我在工作中有機會學習和成長。' },
      ],
    },
  ];

  // step 0 = 說明頁, 1 = 基本資料, 2~(LAYERS.length+1) = 題目層, 最後 = 確認頁
  const TOTAL_STEPS = LAYERS.length + 3;
  let currentStep = 0;
  let unitName = '';
  const profile = {}; // { years_of_service: '3年', is_fire_brigade_member: '是', ... }
  const answers = {}; // { Q1: 3, Q2: 5, ... }

  const contentEl = document.getElementById('content');
  const progressFill = document.getElementById('progressFill');
  const stepLabel = document.getElementById('stepLabel');
  const messageEl = document.getElementById('message');

  function updateProgress() {
    progressFill.style.width = `${(currentStep / (TOTAL_STEPS - 1)) * 100}%`;
    if (currentStep === 0) {
      stepLabel.textContent = '說明頁';
    } else if (currentStep === 1) {
      stepLabel.textContent = '基本資料';
    } else if (currentStep <= LAYERS.length + 1) {
      stepLabel.textContent = `第 ${currentStep - 1} / ${LAYERS.length} 層`;
    } else {
      stepLabel.textContent = '確認送出';
    }
  }

  function renderIntro() {
    contentEl.innerHTML = `
      <h1>消防安全敬業度與應變成熟度量表 (Fire Safety Q12)</h1>
      <h2 class="subtitle">組織消防安全氣候、心理安全感與實戰應變能力評估手冊</h2>
      ${unitName ? `<p style="text-align:center;font-size:13px;color:var(--primary-dark);margin-top:-14px;margin-bottom:20px;">填答單位：${unitName}</p>` : ''}

      <div class="intro-section">
        <h3>量表設計理念與說明</h3>
        <p>本問卷轉化蓋洛普 Q12 敬業度核心架構，專注於評估組織內部的「基礎防護與硬體認知」、「管理支持與正向肯定」、「全員互信與安全氣候」及「實戰演練與持續改善」。採用李克特 5 點量表評分，旨在作為預測組織火災應變盲點與安全領導力的領先指標。</p>
      </div>

      <div class="scale-legend">
        ${LEGEND.map((l, i) => `<span>${i + 1} = ${l}</span>`).join('')}
      </div>

      <p style="text-align:center;font-size:12.5px;color:var(--muted);margin-bottom:20px;">本問卷採不記名方式進行，請依實際狀況誠實作答。</p>

      <div class="btn-row">
        <button class="btn-primary" id="startBtn" style="flex:1">開始作答</button>
      </div>
    `;
    document.getElementById('startBtn').addEventListener('click', () => {
      hideMessage();
      currentStep = 1;
      render();
    });
  }

  function renderProfile() {
    contentEl.innerHTML = `
      <div class="layer-title">基本資料</div>
      ${PROFILE_FIELDS.map(f => {
        if (f.type === 'text') {
          return `
            <div class="field-group" data-key="${f.key}">
              <label class="required">${f.label}</label>
              <input type="text" class="profile-text" data-key="${f.key}" placeholder="${f.placeholder || ''}" value="${profile[f.key] || ''}">
            </div>
          `;
        }
        return `
          <div class="field-group" data-key="${f.key}">
            <label class="required">${f.label}</label>
            <div class="yesno-options">
              <div class="yesno-btn ${profile[f.key] === '是' ? 'selected' : ''}" data-key="${f.key}" data-value="是">是</div>
              <div class="yesno-btn ${profile[f.key] === '否' ? 'selected' : ''}" data-key="${f.key}" data-value="否">否</div>
            </div>
          </div>
        `;
      }).join('')}
      <div class="btn-row">
        <button class="btn-secondary" id="prevBtn">上一步</button>
        <button class="btn-primary" id="nextBtn">下一步</button>
      </div>
    `;

    contentEl.querySelectorAll('.profile-text').forEach(el => {
      el.addEventListener('input', () => {
        profile[el.dataset.key] = el.value;
        contentEl.querySelector(`.field-group[data-key="${el.dataset.key}"]`).classList.remove('unanswered');
        hideMessage();
      });
    });

    contentEl.querySelectorAll('.yesno-btn').forEach(el => {
      el.addEventListener('click', () => {
        const key = el.dataset.key;
        profile[key] = el.dataset.value;
        contentEl.querySelectorAll(`.yesno-btn[data-key="${key}"]`).forEach(b => b.classList.remove('selected'));
        el.classList.add('selected');
        contentEl.querySelector(`.field-group[data-key="${key}"]`).classList.remove('unanswered');
        hideMessage();
      });
    });

    document.getElementById('prevBtn').addEventListener('click', () => {
      currentStep -= 1;
      render();
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      const missing = PROFILE_FIELDS.filter(f => !profile[f.key] || String(profile[f.key]).trim() === '');
      if (missing.length > 0) {
        missing.forEach(f => {
          contentEl.querySelector(`.field-group[data-key="${f.key}"]`).classList.add('unanswered');
        });
        showMessage('請完成所有必填欄位', 'error');
        return;
      }
      hideMessage();
      currentStep += 1;
      render();
    });
  }

  function renderLayer(layerIndex) {
    const layer = LAYERS[layerIndex];
    contentEl.innerHTML = `
      <div class="layer-title">${layer.title}</div>
      ${layer.questions.map(q => `
        <div class="question" data-code="${q.code}">
          <div class="question-code">${q.code}</div>
          <div class="question-text">${q.text}</div>
          <div class="options">
            ${[1, 2, 3, 4, 5].map(v => `
              <div class="option-circle ${answers[q.code] === v ? 'selected' : ''}" data-code="${q.code}" data-value="${v}">${v}</div>
            `).join('')}
          </div>
          <div class="option-hint">① 非常不同意　② 不同意　③ 普通/無意見　④ 同意　⑤ 非常同意</div>
        </div>
      `).join('')}
      <div class="btn-row">
        <button class="btn-secondary" id="prevBtn">上一步</button>
        <button class="btn-primary" id="nextBtn">下一步</button>
      </div>
    `;

    contentEl.querySelectorAll('.option-circle').forEach(el => {
      el.addEventListener('click', () => {
        const code = el.dataset.code;
        const value = parseInt(el.dataset.value, 10);
        answers[code] = value;
        contentEl.querySelectorAll(`.option-circle[data-code="${code}"]`).forEach(o => o.classList.remove('selected'));
        el.classList.add('selected');
        contentEl.querySelector(`.question[data-code="${code}"]`).classList.remove('unanswered');
        hideMessage();
      });
    });

    document.getElementById('prevBtn').addEventListener('click', () => {
      currentStep -= 1;
      render();
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      const unanswered = layer.questions.filter(q => !answers[q.code]);
      if (unanswered.length > 0) {
        unanswered.forEach(q => {
          contentEl.querySelector(`.question[data-code="${q.code}"]`).classList.add('unanswered');
        });
        showMessage('請完成本頁所有題目再繼續', 'error');
        return;
      }
      hideMessage();
      currentStep += 1;
      render();
    });
  }

  function renderReview() {
    const allQuestions = LAYERS.flatMap(l => l.questions);
    contentEl.innerHTML = `
      <div class="layer-title">基本資料</div>
      <table class="review-table">
        ${PROFILE_FIELDS.map(f => `
          <tr><th>${f.label}</th><td class="review-score">${profile[f.key]}</td></tr>
        `).join('')}
      </table>
      <div class="layer-title" style="margin-top:24px;">確認作答結果</div>
      <table class="review-table">
        ${allQuestions.map(q => `
          <tr><th>${q.code}．${q.text}</th><td class="review-score">${answers[q.code]}</td></tr>
        `).join('')}
      </table>
      <div class="btn-row">
        <button class="btn-secondary" id="prevBtn">上一步</button>
        <button class="btn-primary" id="submitBtn">送出</button>
      </div>
    `;

    document.getElementById('prevBtn').addEventListener('click', () => {
      currentStep -= 1;
      render();
    });

    document.getElementById('submitBtn').addEventListener('click', submitResult);
  }

  async function submitResult() {
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.textContent = '送出中...';
    hideMessage();

    const payload = { id: customerId, ...profile, ...answers };

    try {
      const res = await fetch(`${API_BASE_URL}/api/submit_result.php`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();

      if (data.success) {
        contentEl.innerHTML = `<h1>感謝您的填寫！</h1><p style="text-align:center;color:var(--muted);">您的作答已成功送出。</p>`;
        stepLabel.textContent = '已完成';
        progressFill.style.width = '100%';
      } else {
        showMessage(data.message || '送出失敗，請稍後再試', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = '送出';
      }
    } catch (err) {
      showMessage('無法連線至伺服器，請稍後再試', 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = '送出';
    }
  }

  function showMessage(text, type) {
    messageEl.textContent = text;
    messageEl.className = type;
  }
  function hideMessage() {
    messageEl.textContent = '';
    messageEl.className = '';
  }

  function render() {
    updateProgress();
    if (currentStep === 0) {
      renderIntro();
    } else if (currentStep === 1) {
      renderProfile();
    } else if (currentStep <= LAYERS.length + 1) {
      renderLayer(currentStep - 2);
    } else {
      renderReview();
    }
    window.scrollTo(0, 0);
  }

  function renderBlocked(message) {
    contentEl.innerHTML = `
      <h1>無法進入問卷</h1>
      <p style="text-align:center;color:var(--muted);font-size:14px;line-height:1.8;">${message}</p>
    `;
    stepLabel.textContent = '';
    progressFill.style.width = '0%';
  }

  async function verifyAndStart() {
    contentEl.innerHTML = `<p style="text-align:center;color:var(--muted);">驗證中，請稍候...</p>`;

    if (!customerId) {
      renderBlocked('連結缺少ID參數，請確認您使用的是正確的問卷連結。');
      return;
    }

    try {
      const res = await fetch(`${API_BASE_URL}/api/verify_customer.php?id=${encodeURIComponent(customerId)}`);
      const data = await res.json();

      if (!data.success) {
        renderBlocked(data.message || '此連結無法使用，請聯繫相關單位確認。');
        return;
      }

      unitName = data.unit_name || '';
      render();
    } catch (err) {
      renderBlocked('無法連線至伺服器，請稍後再試。');
    }
  }

  verifyAndStart();
</script>

</body>
</html>
